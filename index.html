<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test CHASIDE – I.E. José Santos Figueroa</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#e8f4ea;--card:#fff;--tx:#16261a;--mu:#586b5c;--ac:#1f7a3a;--on:#fff;--bd:#c9e0ce;--ok:#1b8a4b;--er:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a12;--card:#17251b;--tx:#e6f2e8;--mu:#9bb3a0;--ac:#5fd083;--on:#08210f;--bd:#27402d;--ok:#4cc784;--er:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a12;--card:#17251b;--tx:#e6f2e8;--mu:#9bb3a0;--ac:#5fd083;--on:#08210f;--bd:#27402d;--ok:#4cc784;--er:#ff7b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
.hd{background:linear-gradient(135deg,#145c2b,#1f7a3a);color:#fff;border-radius:14px;padding:16px;display:flex;gap:16px;align-items:center;margin:8px 0}
.hd img{height:96px;width:auto;flex:none}.hd h1{font-size:1.15rem;margin:0 0 6px;line-height:1.25}.hd p{margin:0;font-weight:700;letter-spacing:.06em;opacity:.95}.hd small{display:block;margin-top:6px;opacity:.85}
@media (max-width:520px){.hd{flex-direction:column;text-align:center}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.mu{color:var(--mu);font-size:.9rem}
input[type=text]{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
.q{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.q:last-child{border:0}.q.miss{background:color-mix(in srgb,var(--er) 12%,transparent)}
.q b{color:var(--ac);margin-right:6px}.q span{flex:1}
.opt{display:flex;gap:6px}.opt label{border:1px solid var(--bd);border-radius:8px;padding:6px 14px;cursor:pointer;user-select:none}
.opt input{display:none}.opt input:checked+span{font-weight:700;color:var(--ac)}
.opt label:has(input:checked){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
button{background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
.pg{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}.pg div{height:100%;background:var(--ac);width:0}
.tabs{display:flex;gap:8px;margin:8px 0}
.sc{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.sc div{border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}.sc div.top{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.sc strong{display:block;font-size:1.4rem}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:center;white-space:nowrap}td:first-child,th:first-child{text-align:left}
.hide{display:none}
</style></head><body><main>

if(CFG.mode=="api"){const r=await fetch(CFG.apiUrl,{headers:{"x-admin":adminPass}});if(!r.ok)throw new Error(r.status==401?"Contraseña incorrecta":"HTTP "+r.status);return await r.json()}
return Object.values(JSON.parse(localStorage.getItem("chaside")||"{}"))}};
function showRes(c){const t=c.top;$("res").classList.remove("hide");
$("res").innerHTML=`<h2 style="margin-top:0">¡Gracias! Tus resultados</h2><div class="sc">${L.split("").map(l=>`<div class="${t.includes(l)?"top":""}"><b>${l}</b><strong>${c.r[l].t}</strong><span class="mu">Int ${c.r[l].i} · Apt ${c.r[l].p}</span></div>`).join("")}</div>
<p><b>1.º ${t[0]}</b> – Área ${AREA[t[0]]}<br><b>2.º ${t[1]}</b> – Área ${AREA[t[1]]}</p>`;$("res").scrollIntoView({behavior:"smooth"})}
$("env").onclick=async()=>{
const nom=$("nom").value.trim(),cur=$("cur").value.trim(),a=get();
if(!nom||!cur){$("msg").textContent="Escribe tu nombre y curso.";return}
const miss=a.map((v,i)=>v===null?i:-1).filter(i=>i>=0);
document.querySelectorAll(".q").forEach((e,i)=>e.classList.toggle("miss",miss.includes(i)));
if(miss.length){$("msg").textContent=`Faltan ${miss.length} preguntas (marcadas en rojo).`;$("q"+miss[0]).scrollIntoView({block:"center"});return}
$("env").disabled=true;$("msg").textContent="Guardando…";
const c=calc(a);const id="r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sc={};L.split("").forEach(l=>{sc[l+"_int"]=c.r[l].i;sc[l+"_apt"]=c.r[l].p;sc[l]=c.r[l].t});
try{await store.save(id,{nombre:nom,curso:cur,fecha:new Date().toISOString(),resp:a.join(""),area1:c.top[0],area2:c.top[1],...sc});
$("msg").textContent="✔ Respuestas guardadas.";showRes(c)}catch(e){$("env").disabled=false;$("msg").textContent="Error al guardar: "+(e.message||e.code)}};
let rows=[];
function renderAdmin(){rows.sort((a,b)=>a.fecha<b.fecha?1:-1);$("cnt").textContent=rows.length+" encuestados";
const h=["Nombre","Curso",...L.split(""),"Área 1","Área 2"];
let s="<tr>"+h.map(x=>`<th>${x}</th>`).join("")+"</tr>";
rows.forEach(r=>{s+=`<tr><td>${esc(r.nombre)}</td><td>${esc(r.curso)}</td>${L.split("").map(l=>`<td>${r[l]}</td>`).join("")}<td>${r.area1}</td><td>${r.area2}</td></tr>`});
if(rows.length){s+=`<tr><th>Promedio</th><th></th>${L.split("").map(l=>`<th>${(rows.reduce((x,r)=>x+r[l],0)/rows.length).toFixed(1)}</th>`).join("")}<th></th><th></th></tr>`}
$("tb").innerHTML=s}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("dl").onclick=()=>{
const LL=L.split(""),f2=v=>String(v).padStart(2,"0"),fd=x=>{const d=new Date(x);return isNaN(d)?"":f2(d.getDate())+"/"+f2(d.getMonth()+1)+"/"+d.getFullYear()};
const top=(r,k,o)=>LL.slice().sort((x,y)=>r[y+k]-r[x+k]||r[y+o]-r[x+o]).slice(0,2).join(" - ");
const A=[["Nombre","Curso","Fecha","INTERESES",...Array(7).fill(""),"APTITUDES",...Array(7).fill("")],["","","",...LL,"Resultado",...LL,"Resultado"],...rows.map(r=>[r.nombre,r.curso,fd(r.fecha),...LL.map(l=>r[l+"_int"]),top(r,"_int","_apt"),...LL.map(l=>r[l+"_apt"]),top(r,"_apt","_int")])];
const B=[["Nombre","Curso",...Q.map((_,i)=>"P"+(i+1))],...rows.map(r=>[r.nombre,r.curso,...r.resp.split("").map(x=>x=="1"?"Sí":"No")])];
const wb=XLSX.utils.book_new();const ws=XLSX.utils.aoa_to_sheet(A);ws["!merges"]=[{s:{r:0,c:3},e:{r:0,c:10}},{s:{r:0,c:11},e:{r:0,c:18}},{s:{r:0,c:0},e:{r:1,c:0}},{s:{r:0,c:1},e:{r:1,c:1}},{s:{r:0,c:2},e:{r:1,c:2}}];ws["!cols"]=[{wch:28},{wch:10},{wch:11},...Array(7).fill({wch:4}),{wch:12},...Array(7).fill({wch:4}),{wch:12}];XLSX.utils.book_append_sheet(wb,ws,"Resultados");XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(B),"Respuestas");
XLSX.writeFile(wb,"chaside_resultados.xlsx")};
async function load(){try{rows=await store.all();renderAdmin()}catch(e){$("cnt").textContent="Error: "+e.message}}
$("rf").onclick=load;
$("bd").onclick=async()=>{
if(CFG.mode=="api"){alert("Con server.js borra el archivo respuestas.json del servidor.");return}
if(!rows.length&&!confirm("No hay datos visibles. ¿Intentar borrar de todos modos?"))return;
if(!confirm("Se borrarán TODAS las respuestas ("+rows.length+" encuestados). Esto NO se puede deshacer.\n\n¿Ya descargaste el Excel?"))return;
const t=prompt("Para confirmar, escribe BORRAR");if(t!=="BORRAR"){alert("Cancelado.");return}
$("bd").disabled=true;$("cnt").textContent="Borrando…";
try{if(CFG.mode=="firebase"){const sn=await FB.getDocs(FB.collection(FB.db,"respuestas"));await Promise.all(sn.docs.map(d=>FB.deleteDoc(d.ref)))}
else localStorage.removeItem("chaside");
rows=[];renderAdmin();$("cnt").textContent="Datos borrados. Empezamos de cero."}
catch(e){$("cnt").textContent="Error al borrar: "+(e.code||e.message)+" (revisa las reglas de Firestore)"}
$("bd").disabled=false};
let live=false;
$("t2").onclick=async()=>{
if(CFG.mode=="firebase"){if(!window.FB){alert("Firebase no está listo. Revisa firebaseConfig.");return}
if(!live){const p=prompt("Contraseña de administrador:");if(p===null)return;if(p!==CFG.adminPass){alert("Contraseña incorrecta");return}}
adminPass="ok";show("v2");if(!live){live=true;FB.onSnapshot(FB.collection(FB.db,"respuestas"),sn=>{rows=sn.docs.map(d=>d.data());renderAdmin()},e=>{$("cnt").textContent="Error: "+e.code})}return}
if(!adminPass){const p=prompt("Contraseña de administrador:");if(p===null)return;if(p!==CFG.adminPass&&CFG.mode!="api"){alert("Contraseña incorrecta");return}adminPass=p}show("v2");load()};
setInterval(()=>{if(CFG.mode!="firebase"&&adminPass&&!$("v2").classList.contains("hide"))load()},15000);
</script></body></html>
